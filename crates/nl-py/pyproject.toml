# Build settings for the Rust extension module `ninelives_sim` (built with maturin).
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ninelives-sim"
requires-python = ">=3.11,<3.13"
version = "0.1.0"
description = "Rust simulation core for Nine Lives, exposed to Python."
license = "MIT"

[tool.maturin]
module-name = "ninelives_sim"
