# FROZEN copy of configs/vehicle.toml used only by the golden trace.
# Tuning configs/vehicle.toml must not change the golden hash, so this file stays as
# it was when the hash was recorded. Only edit it together with flat_drive.json.

# The car: chassis, wheels, suspension and drive (SPEC §7.2–7.3).
# Every value here is a starting value to tune. Units are SI and the body frame is
# +X forward, +Y up, +Z right, with the origin at the centre of mass (SPEC §4).

[chassis]
dry_mass_kg = 1800.0
# Half-size of the main body box, in metres (x = half length, y = half height, z = half width).
half_extents_m = [2.1, 0.45, 1.0]
# A thin box on top of the body, so a roof hit can be told apart from a body hit (SPEC §7.9).
roof_half_extents_m = [1.2, 0.05, 0.8]
# Moments of inertia about the body axes: roll (X), yaw (Y), pitch (Z), in kg·m².
# Set by hand because a real car is not a uniform box.
inertia_kg_m2 = [850.0, 3250.0, 2900.0]

[air_drag]
# Drag force = -0.5 · air density · drag area · |v| · v  (SPEC §7.2).
air_density_kg_m3 = 1.2
drag_area_m2 = 0.6

[wheels]
# Where each suspension is attached, in the body frame, in wheel order FL, FR, RL, RR.
# Left is -Z, right is +Z.
mount_points_m = [
    [1.3, 0.0, -0.85],
    [1.3, 0.0, 0.85],
    [-1.3, 0.0, -0.85],
    [-1.3, 0.0, 0.85],
]
radius_m = 0.34
suspension_rest_length_m = 0.3
suspension_max_travel_m = 0.2
# Rapier's raycast vehicle multiplies these by the car's mass, so they are
# accelerations: stiffness in (m/s²) per metre of compression, damping in (m/s²) per (m/s).
# With 4 wheels, each wheel compresses about g / (4 · stiffness) = 0.05 m at rest,
# which puts the centre of mass about 0.6 m above the ground.
suspension_stiffness_per_kg = 50.0
suspension_compression_damping_per_kg = 3.5
suspension_relaxation_damping_per_kg = 5.0
max_suspension_force_n = 40000.0
# Tyre grip: sideways grip is about friction_slip × g (1.2 g here), and Rapier allows
# twice that for driving and braking forces.
friction_slip = 1.2
side_friction_stiffness = 1.0

[drive]
# All-wheel drive.
max_engine_force_per_wheel_n = 6000.0
max_speed_m_s = 45.0
max_reverse_speed_m_s = 8.0
# Brake impulse per wheel per physics step, in N·s.
# 40 N·s × 120 steps/s × 4 wheels ≈ 19 kN, about 1.1 g of braking for 1800 kg.
brake_impulse_per_wheel_n_s = 40.0
# A tiny brake on every wheel when no pedal is pressed, so the car slowly coasts to a
# stop instead of rolling forever. 1.5 N·s × 120 × 4 ≈ 0.7 kN, about 0.04 g.
rolling_resistance_impulse_per_wheel_n_s = 1.5
# Below this forward speed, pulling back on the throttle reverses instead of braking.
reverse_below_speed_m_s = 0.5

[steering]
# Front wheels only. The limit shrinks linearly from the low-speed value to the
# high-speed value as speed rises from 0 to `high_speed_m_s`.
max_angle_low_speed_rad = 0.5
max_angle_high_speed_rad = 0.15
high_speed_m_s = 40.0
# How fast the wheels can turn, in rad/s.
max_rate_rad_s = 2.0
[thrusters]
# Valve lag: each valve opens and closes like a first-order filter (SPEC §7.4).
valve_time_constant_s = 0.03
# Cold-gas exhaust speed; air used per second = thrust / exhaust speed (SPEC §7.5).
exhaust_speed_m_s = 600.0

# Thruster interlock (SPEC §7.4): while the car is steady on the ground (all four limits),
# the controller's throttles are cut; Hop and Boost feed-forward still fire. It stops any
# controller idling thrust while parked or pushing the car off the track while driving
# (EXPERIMENTS 2026-10-19), and never cuts a save: a falling, tilted or spinning car isn't
# steady. The centre of mass rests about 0.6 m up.
[thrusters.interlock]
max_tilt_deg = 15.0
max_height_m = 1.0
max_spin_rad_s = 1.0
max_vertical_speed_m_s = 1.0


# The 10 nozzles, in the fixed SPEC §4 order. Position is relative to the centre of
# mass in the body frame (+X forward, +Y up, +Z right). Direction is the push on the
# car (opposite to the exhaust). Max force is for Realistic mode; modes scale it.
[[thrusters.nozzles]]
name = "L_FL"
position_m = [1.6, -0.3, -0.85]
direction = [0.0, 1.0, 0.0]
max_force_n = 12000.0

[[thrusters.nozzles]]
name = "L_FR"
position_m = [1.6, -0.3, 0.85]
direction = [0.0, 1.0, 0.0]
max_force_n = 12000.0

[[thrusters.nozzles]]
name = "L_RL"
position_m = [-1.6, -0.3, -0.85]
direction = [0.0, 1.0, 0.0]
max_force_n = 12000.0

[[thrusters.nozzles]]
name = "L_RR"
position_m = [-1.6, -0.3, 0.85]
direction = [0.0, 1.0, 0.0]
max_force_n = 12000.0

[[thrusters.nozzles]]
name = "S_FL"
position_m = [1.4, 0.5, -1.0]
direction = [0.0, 0.0, 1.0]
max_force_n = 4000.0

[[thrusters.nozzles]]
name = "S_RL"
position_m = [-1.4, 0.5, -1.0]
direction = [0.0, 0.0, 1.0]
max_force_n = 4000.0

[[thrusters.nozzles]]
name = "S_FR"
position_m = [1.4, 0.5, 1.0]
direction = [0.0, 0.0, -1.0]
max_force_n = 4000.0

[[thrusters.nozzles]]
name = "S_RR"
position_m = [-1.4, 0.5, 1.0]
direction = [0.0, 0.0, -1.0]
max_force_n = 4000.0

[[thrusters.nozzles]]
name = "B_L"
position_m = [-2.1, 0.0, -0.4]
direction = [1.0, 0.0, 0.0]
max_force_n = 8000.0

[[thrusters.nozzles]]
name = "B_R"
position_m = [-2.1, 0.0, 0.4]
direction = [1.0, 0.0, 0.0]
max_force_n = 8000.0
[events]
# Event rules from SPEC §7.9. Angles are in degrees here for readability.
# An upset starts after this long with no wheel touching, or above this tilt.
upset_airborne_s = 0.3
upset_tilt_deg = 60.0
# A save: back on all 4 wheels, nearly level and nearly still, held this long.
save_tilt_deg = 15.0
save_max_spin_rad_s = 1.5
save_hold_s = 0.5
# Crash if the body or roof hits something faster than this along the contact normal.
crash_impact_speed_m_s = 6.0
# Crash if the roof touches anything while tilted past this ("upside down").
upside_down_tilt_deg = 120.0
# Crash if tilted past `stuck_tilt_deg` for longer than `stuck_s`.
stuck_tilt_deg = 100.0
stuck_s = 2.0
# Crash below this height.
out_of_bounds_y_m = -20.0
# Game only: after a crash the wreck stays frozen this long, then the car respawns at
# the last checkpoint. Training ends the episode at the crash instead.
respawn_delay_s = 1.5
# Landing quality (PLAN §3.3). A touchdown is a hard landing (an event and a reward
# cost, not a crash) when any wheel's suspension compression (0 extended, 1 bottomed
# out) reaches hard_landing_compression within hard_landing_window_s of the first wheel
# touching.
hard_landing_compression = 0.95
hard_landing_window_s = 0.2
# Speed kept = forward speed speed_kept_delay_s after touchdown ÷ forward speed at
# take-off, measured only when the car took off from its wheels faster than
# speed_kept_min_take_off_m_s (so drops and tip-overs are not judged on it).
speed_kept_delay_s = 0.5
speed_kept_min_take_off_m_s = 3.0

[chaos]
# A random knock (SPEC §7.12): a push and a twist in random directions, each up to
# these sizes.
max_linear_impulse_n_s = 8000.0
max_angular_impulse_n_m_s = 3000.0
