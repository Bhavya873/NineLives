# The `ninelives` Python package: Gymnasium/SB3 environment, training, evaluation, export and charts.
# Physics is never written here; it comes from the Rust module `ninelives_sim` (crates/nl-py).
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ninelives"
version = "0.1.0"
description = "Training and evaluation tools for Nine Lives."
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.1",
    "gymnasium>=1.2",
    "stable-baselines3>=2.9",
    # CPU is enough: a small MLP, and the physics is the bottleneck (PLAN §5.1).
    "torch>=2.8",
    "pyyaml>=6",
    "tensorboard>=2.20",
]

[project.optional-dependencies]
dev = [
    "cma>=4",
    "maturin>=1.15,<2",
    "pytest>=9",
    "ruff>=0.17",
]

[tool.setuptools.packages.find]
include = ["ninelives*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear, annotations.
select = ["E", "F", "I", "N", "UP", "B", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["ninelives", "ninelives_sim"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import ninelives from this folder even when the editable install's .pth file is
# skipped (macOS hides .pth files in iCloud-synced folders, and Python 3.12 ignores them).
pythonpath = ["."]
