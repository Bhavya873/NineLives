# Training and eval scenarios (SPEC §9.5, §9.6). Ranges are [low, high], drawn evenly.
# Numbers marked (start) in the SPEC: tune freely and log the change in EXPERIMENTS.md.

[episode]
# An episode ends early on a crash, or on success: all four wheels down for this long,
# unbroken, with no crash...
success_hold_s = 1.0
# ...and the controller's throttle sum below success_quiet_throttle_sum for the last
# success_quiet_hold_s of it, unbroken, so blowing air while parked is not a finished
# episode (PLAN §3.3). Success needs four wheels down, so lifting a wheel can't dodge it.
success_quiet_throttle_sum = 0.05
# ...not counting nozzles below this throttle: near-zero noise isn't idling, while the old
# idle habit (0.08-0.4 on a few nozzles) still fails (owner's round-4 choice, 2026-10-19).
success_quiet_nozzle_deadband = 0.02
success_quiet_hold_s = 0.5
# Settled (PLAN §3.3): four wheels down, spin below the save rule's
# save_max_spin_rad_s (vehicle.toml [events]) and sideways speed below
# settle_max_side_speed_m_s. Settle time runs from the first touchdown until the car is
# settled for good; the reward charges each unsettled step after a touchdown.
settle_max_side_speed_m_s = 1.0
# Stage C and D (PLAN §3.3): every judged landing (a Save after a take-off from the
# wheels) must keep the nose within this many degrees of its take-off heading; a worse
# landing ends the episode as a failure.
max_landing_heading_error_deg = 30.0
# Otherwise it is cut off after this long (Stage A and B; C, D and E set their own).
time_limit_s = 8.0
# Starts are lifted so the body's lowest corner is at least this high (Stage B: exactly).
spawn_clearance_m = 0.05

[stage_a]
# Drop: the car starts in the air in a random attitude and spin.
# Centre-of-mass height; raised further if a tilted corner would be below the clearance.
height_m = [1.5, 8.0]
# Tilt from upright about a random horizontal axis, up to this; the curriculum raises it to 180.
max_tilt_deg = 180.0
# Spin size, about a random axis, up to this; the curriculum raises it to 6.
max_spin_rad_s = 6.0
horizontal_speed_m_s = [0.0, 15.0]
# Positive is up.
vertical_speed_m_s = [-5.0, 3.0]

[stage_b]
# Side tip-over: the car starts just above the ground, lying on one side.
roll_deg = [60.0, 110.0]
# Plus a small random pitch and yaw, up to this either way.
max_pitch_yaw_deg = 10.0
max_speed_m_s = 2.0

[curriculum_a]
# SPEC §9.6: Stage A gets harder in `levels` steps. Level 0 tilts up to
# first_max_tilt_deg and spins up to first_max_spin_rad_s; each level moves evenly
# towards stage_a's max_tilt_deg and max_spin_rad_s, which the last level uses.
# Eval always uses the last level.
levels = 5
first_max_tilt_deg = 30.0
first_max_spin_rad_s = 0.0

[stage_c]
# Hop (SPEC §9.6): driving straight on a flat 20 m track; the driver bot holds the start
# speed and presses Hop. Success is a save after the hop without touching the cars.
time_limit_s = 15.0
speed_m_s = [5.0, 25.0]
# When Hop is pressed (s after the start) when there is no car row.
hop_time_s = [1.0, 3.0]
car_row_probability = 0.5
car_row_count = [1, 3]
car_row_height_m = [1.2, 1.5]
# The row is placed so a hop pressed at hop_time_s is highest over its middle, and only
# as many cars stay as that hop clears: the wheels this high above the roofs, for the
# row plus the car's own length plus this spare distance (m); no row if it can't clear one.
# The clearance is driver_bot.hop_clearance_m, so the bot times its press the same way.
spare_length_m = 1.0
# Track beyond what the car could cover in the time limit (m).
run_out_m = 50.0

[stage_d]
# Course (SPEC §9.6): the bot drives a procedural course (configs/pieces.json) to its
# finish without crashing.
time_limit_s = 45.0
# The bot's target speed is raised to at least course length ÷ (this × time limit), so a
# long course drawn with a slow target can still be finished.
time_use_fraction = 0.75

[stage_e]
# Chaos (SPEC §9.6): Stage A, C or D plus Chaos knocks. Success also needs every knock
# to have happened, and (on A and C) four wheels down for success_hold_s after the last.
time_limit_s = 45.0
# Relative chances of the base stage: [A, C, D].
base_stage_weights = [1.0, 1.0, 1.0]
knock_count = [1, 3]
# When each knock comes (s after the start).
knock_time_s = [0.5, 6.0]

[driver_bot]
# SPEC §9.7 (training only). Stage D's target speed; Stage C holds its start speed.
target_speed_m_s = [10.0, 30.0]
# Pure-pursuit look-ahead: base + this × speed (m, s).
lookahead_base_m = 6.0
lookahead_per_speed_s = 0.3
# The pursuit's turns pull at most this hard sideways (m/s²), so the bot doesn't spin the
# car when it lands off the line (the wobble and jerks come on top).
max_turn_accel_m_s2 = 6.0
# Throttle per m/s of speed error.
speed_gain_per_m_s = 0.3
# Ornstein–Uhlenbeck steering wobble: steady-state size and return rate (per s).
steer_noise_sigma = 0.1
steer_noise_return_per_s = 1.0
# Sudden steering jerks: chance per second, size (steer units) and length (s).
jerk_chance_per_s = 0.05
jerk_size = 0.5
jerk_s = 0.3
# Hop is pressed up to this early or late (s), timed so the wheels pass this high (m)
# above a car row marked hop_hint.
hop_timing_noise_s = 0.15
hop_clearance_m = 0.1

[randomization]
# SPEC §9.8: each training episode draws its own car and world from these ranges
# ([low, high], drawn evenly) when training turns randomization on. Eval leaves it off.
mass_factor = [0.9, 1.1]
# Centre of mass moved up to this far along each body axis, in m.
center_of_mass_offset_m = 0.1
inertia_factor = [0.9, 1.1]
# Drawn separately for every nozzle.
max_force_factor = [0.85, 1.15]
valve_time_constant_s = [0.02, 0.06]
# Whole control steps between the policy acting and the valves hearing it.
latency_control_steps = [0, 2]
ground_friction = [0.6, 1.2]
# Wind up to this speed along each horizontal world axis, either way, in m/s.
wind_m_s = 3.0
thrust_scale = [1.0, 2.0]
# Otherwise the tank holds tank_capacity_kg.
unlimited_air_probability = 0.4
tank_capacity_kg = [150.0, 350.0]

[randomization.noise]
# Gaussian observation noise (standard deviations).
gravity_dir = 0.01
spin_rad_s = 0.05
speed_m_s = 0.1
height_m = 0.05
