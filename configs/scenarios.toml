# Training and eval scenarios (SPEC §9.5, §9.6). Ranges are [low, high], drawn evenly.
# Numbers marked (start) in the SPEC: tune freely and log the change in EXPERIMENTS.md.

[episode]
# An episode ends early on a crash, or on success: all four wheels down for this long,
# unbroken, with no crash...
success_hold_s = 1.0
# ...and the controller's throttle sum below success_quiet_throttle_sum for the last
# success_quiet_hold_s of it, unbroken, so blowing air while parked is not a finished
# episode (PLAN §3.3). Success needs four wheels down, so lifting a wheel can't dodge it.
success_quiet_throttle_sum = 0.05
success_quiet_hold_s = 0.5
# Settled (PLAN §3.3): four wheels down, spin below settle_max_spin_rad_s and sideways
# speed below settle_max_side_speed_m_s. Settle time runs from the first touchdown until
# the car is settled for good; the reward charges each unsettled step after a touchdown.
settle_max_spin_rad_s = 1.5
settle_max_side_speed_m_s = 1.0
# Otherwise it is cut off after this long (Stage A and B).
time_limit_s = 8.0
# Starts are lifted so the body's lowest corner is at least this high (Stage B: exactly).
spawn_clearance_m = 0.05

[stage_a]
# Drop: the car starts in the air in a random attitude and spin.
# Centre-of-mass height; raised further if a tilted corner would be below the clearance.
height_m = [1.5, 8.0]
# Tilt from upright about a random horizontal axis, up to this; the curriculum raises it to 180.
max_tilt_deg = 180.0
# Spin size, about a random axis, up to this; the curriculum raises it to 6.
max_spin_rad_s = 6.0
horizontal_speed_m_s = [0.0, 15.0]
# Positive is up.
vertical_speed_m_s = [-5.0, 3.0]

[stage_b]
# Side tip-over: the car starts just above the ground, lying on one side.
roll_deg = [60.0, 110.0]
# Plus a small random pitch and yaw, up to this either way.
max_pitch_yaw_deg = 10.0
max_speed_m_s = 2.0

[curriculum_a]
# SPEC §9.6: Stage A gets harder in `levels` steps. Level 0 tilts up to
# first_max_tilt_deg and spins up to first_max_spin_rad_s; each level moves evenly
# towards stage_a's max_tilt_deg and max_spin_rad_s, which the last level uses.
# Eval always uses the last level.
levels = 5
first_max_tilt_deg = 30.0
first_max_spin_rad_s = 0.0

[randomization]
# SPEC §9.8: each training episode draws its own car and world from these ranges
# ([low, high], drawn evenly) when training turns randomization on. Eval leaves it off.
mass_factor = [0.9, 1.1]
# Centre of mass moved up to this far along each body axis, in m.
center_of_mass_offset_m = 0.1
inertia_factor = [0.9, 1.1]
# Drawn separately for every nozzle.
max_force_factor = [0.85, 1.15]
valve_time_constant_s = [0.02, 0.06]
# Whole control steps between the policy acting and the valves hearing it.
latency_control_steps = [0, 2]
ground_friction = [0.6, 1.2]
# Wind up to this speed along each horizontal world axis, either way, in m/s.
wind_m_s = 3.0
thrust_scale = [1.0, 2.0]
# Otherwise the tank holds tank_capacity_kg.
unlimited_air_probability = 0.4
tank_capacity_kg = [150.0, 350.0]

[randomization.noise]
# Gaussian observation noise (standard deviations).
gravity_dir = 0.01
spin_rad_s = 0.05
speed_m_s = 0.1
height_m = 0.05
