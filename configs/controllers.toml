# Controller settings (SPEC §8). Numbers marked (start) in the SPEC: tune freely and log
# the change in docs/EXPERIMENTS.md.

[pd]
# Attitude: desired torque = inertia × (kp × error − kd × spin).
kp = 6.625
kd = 5.083
# Tumbling, PD pushes harder: past tumble_blend_end_deg of tilt it uses kp_tumble and
# kd_tumble, and from tumble_blend_start_deg it blends there linearly. The PD numbers and
# lag_compensation were tuned together by CMA-ES on seeds 2,000,000+, stages A-F, both
# modes, plain and randomized (EXPERIMENTS 2026-10-27).
kp_tumble = 39.46
kd_tumble = 4.532
tumble_blend_start_deg = 57.86
tumble_blend_end_deg = 83.03
# Vertical braking: only when airborne, roughly upright (up alignment above
# upright_alignment), falling faster than brake_speed_m_s and low enough: below
# brake_height_m, or below brake_safety × the stopping distance + brake_margin_m, where
# the stopping distance counts on brake_usable_fraction of full lift. So a fast fall
# brakes early instead of landing hard. Then aim to fall at target_descent_m_s, with gain kv.
upright_alignment = 0.7
brake_height_m = 3.0
brake_safety = 1.3
brake_usable_fraction = 0.8
brake_margin_m = 1.0
brake_speed_m_s = 4.0
target_descent_m_s = 0.2538
kv = 6.025
# Below this height, not upright and falling slower than lying_max_fall_speed_m_s, the
# car is lying on the ground: roll torque only, to flip back onto its wheels.
on_ground_height_m = 1.2
lying_max_fall_speed_m_s = 1.0
# Lying on the ground, the roll torque is multiplied by this (tipping over the side edge
# needs far more torque than turning in the air).
ground_roll_gain = 3.547
# Lying on its side, the side boosters also push the car up with this share of its
# weight, along whichever side axis points up.
ground_side_push = 0.3253
# In the air, damp sideways sliding with gain kv_lateral (1/s): the side boosters
# straighten the car's path before touchdown.
kv_lateral = 0.9275
# Passenger comfort: PD never asks for more angular acceleration than this (rad/s²).
# A car already spinning fast towards upright the long way keeps going round.
max_angular_accel_rad_s2 = 25.0
# Air control from the driver, high enough in the air and roughly upright: full steer
# asks for air_yaw_rate_rad_s, full throttle/brake for air_pitch_rad nose down/up.
# Below air_wish_min_height_m PD lines the car up for landing instead.
air_yaw_rate_rad_s = 1.5
air_pitch_rad = 0.35
air_wish_min_height_m = 3.0
# With two wheels down, tilted at most quiet_max_tilt_deg and spinning at most
# quiet_max_spin_rad_s, PD counts the car as driving and fires nothing: a wheel lifting on
# a bump is not a save.
quiet_max_tilt_deg = 15.0
quiet_max_spin_rad_s = 1.5

[allocation]
# Solve min |W(B·u − w)|² + λ|u|² with 0 ≤ u ≤ 1 by projected gradient (SPEC §8).
# Weights act on rows scaled to 1 at the strongest nozzle; torque matters more.
force_weight = 1.0
torque_weight = 3.0
regularisation = 0.001
iterations = 30
# "legacy" plans as if B·u happened at once. "actuator_aware" plans with the actuator
# predictor (nl_sim::actuator_model): valve lag over the control interval, the Hop/Boost
# throttles underneath and the interlock (docs/control-upgrade-audit.md).
model = "actuator_aware"
# actuator_aware only: share of the valve lag made up within one control interval (0..1).
lag_compensation = 0.3572

# Stunts (plan 2026-10-27 G4, docs/contracts/stunt-states.md; numbers from
# docs/research/stunt-planning.md §4, all (start)). Every entry is optional; left out, the
# value here applies.
[stunt]
# Coast rate per stunt and mode, rad/s.
flip_coast_rate_realistic_rad_s = 5.0
barrel_coast_rate_realistic_rad_s = 5.0
flip_coast_rate_arcade_rad_s = 5.0
barrel_coast_rate_arcade_rad_s = 6.0
# Reachable angular acceleration at thrust scale 1 and a full tank, rad/s² (the planner
# multiplies by the mode's thrust scale and the tank gate).
pitch_alpha_rad_s2 = 13.2
roll_alpha_rad_s2 = 28.7
# Air used while firing full stunt torque at thrust scale 1, kg/s.
pitch_air_kg_s = 40.0
roll_air_kg_s = 53.3
# The Brake phase hands over to PD at this spin, rad/s.
handover_rate_rad_s = 1.5
# PD's catch budget after the hand-over: time (s) and air (kg).
catch_time_s = 0.8
catch_air_kg = 11.0
# "Complete" needs at least 2π minus this, rad.
complete_rotation_slack_rad = 0.15
settle_margin_s = 0.3
# Landing authorization (rule 1) and the forecast's uncertainty samples (rule 2).
landing_max_normal_tilt_deg = 15.0
landing_min_length_car_lengths = 2.0
car_length_m = 4.2
forecast_speed_spread = 0.02
forecast_pitch_spread_deg = 1.0
# Air (rule 3) and start envelope (rule 4).
air_margin = 1.25
landing_reserve_kg = 60.0
start_max_tilt_deg = 25.0
start_max_spin_rad_s = 1.5
# Request handling.
request_timeout_s = 3.0
hybrid_hold_after_settled_s = 1.0

# The AI takes over only past 120 deg, so PD keeps the upsets it saves well (EXPERIMENTS 2026-10-27, R4).
[hybrid]
enter_tilt_deg = 120.0
# The policy envelope: the AI was only validated up to this speed (m/s), and its observation
# clamps velocity at 60 m/s. Faster than this, or with any saturating observation value on its
# clamp bound (angular and body velocity, thrust_scale, hop_time_left), PD has the nozzles and
# HudField 27 PolicyOutOfEnvelope is set; inside again, the normal gate rules apply. Left out,
# the limit is 55. Raise it only after running the Hybrid eval at the higher speed and logging
# the result in docs/EXPERIMENTS.md ("validated" means exactly that).
# policy_max_speed_m_s = 55.0
