# Reward per control step (SPEC §9.4). Every number is a starting value to tune; log
# each change in docs/EXPERIMENTS.md. There is no survival bonus, on purpose: being
# alive must not pay, or the policy learns to hover (SPEC §9.11).

[weights]
# Tilt: weight × (up·world_up − 1), so 0 upright and −2 × weight upside down.
tilt = 0.05
# Spin: weight × −min(|ω|², spin_cap).
spin = 0.002
# Air with a limited tank: weight × −(air used this step / tank capacity).
# 4× SPEC §9.4's 2.0 (and unlimited 4× 0.002): with the start weights the policy kept
# a nozzle open after landing (run stage-a-001, docs/EXPERIMENTS.md).
air_limited = 8.0
# Air when unlimited: weight × −(sum of the 10 throttles).
air_unlimited = 0.008
# Airborne: weight × −1 per step while flying (no wheel, body or roof touching) longer
# than airborne_grace_s.
airborne = 0.02
# Smoothness: weight × −|u_t − u_(t−1)|².
smoothness = 0.002
# Save event: weight × (save_base + save_quality × q).
save = 1.0
# Crash event (ends the episode): weight × −crash_penalty.
crash = 1.0
# Landing quality (PLAN §3.3). Hard landing: weight × −1 per HardLanding event (a wheel
# bottomed out at touchdown, vehicle.toml [events]).
hard_landing = 1.0
# Unsettled: weight × −1 per step after the episode's first touchdown while the car is
# not settled (scenarios.toml [episode] settle_*).
# 0 since the gate-2 ablation (EXPERIMENTS 2026-10-19): with 0.01 the policy landed safely
# but never settled quietly (0% success at 20M steps vs 81% without it). Settle time stays
# an eval column.
unsettled = 0.0
# Air left: weight × (share of the tank left), once, on the step the episode succeeds,
# only with a limited tank (unlimited air has nothing to save).
air_left = 1.0
# Success: weight, once, on the step the episode succeeds. Success needs four wheels down,
# a quiet throttle and the hold (SPEC §9.5), so this pays for the quiet landing itself;
# without it the policy idled thrust while parked (EXPERIMENTS m7-full-002).
success = 5.0
# Passenger comfort: per step, weight × (g-load − shape.g_soft_limit)² above the limit.
# At 5 g that is 0.2 a step, so sustained high g costs more than most saves pay.
g_force = 0.05

[shape]
# |ω|² above this is not charged more (rad²/s²).
spin_cap_rad2_s2 = 50.0
# Airtime shorter than this is free (a hop or a short drop).
airborne_grace_s = 0.5
# Passenger g-load above this costs weights.g_force (the game starts blacking out here).
g_soft_limit = 3.0
# Save = save_base + save_quality × q, with
# q = clamp01(1 − |ω| / save_spin_scale) × clamp01(1 − fall speed / save_fall_scale)
#   × clamp01(1 − heading error / save_heading_scale) × clamp01(speed kept),
# with |ω| and the fall speed taken just before the wheels touched down, the heading
# error between the nose at touchdown and at take-off, and speed kept as in
# vehicle.toml [events] (a factor of 1 when not measured).
save_base = 2.0
save_quality = 3.0
save_spin_scale_rad_s = 4.0
save_fall_scale_m_s = 6.0
save_heading_scale_deg = 45.0
crash_penalty = 10.0
