# Round 7: residual-r2.yaml trained for realistic only (one policy per mode; owner).
# Otherwise the same as residual-r2.yaml.

seed: 0
mode: realistic  # the one mode this policy is for
stages: [A, B, C, D, E]  # SPEC §9.6, §9.9 unlock order; [A] trains Stage A alone
randomize: true        # SPEC §9.8 domain randomization (car, latency, noise, wind)
randomize_mode: false  # keep the realistic preset under randomization (round 7)
total_steps: 25_000_000

# scale 0.5: one unit of action moves a throttle by half its range, enough to reshape a
# manoeuvre or add braking PD lacks, while exploration noise (std ≈ 0.37 action, so
# ≈ 0.18 throttle at log_std_init −1) cannot drown PD's corrections. Scale 1 would let
# the noise cancel PD outright on every nozzle.
residual:
  base: pd
  scale: 0.5
  force_scaled: true
  gated: true

ppo:
  n_envs: 64
  n_steps: 512         # 64 × 512 = 32,768 samples per update
  batch_size: 4096
  n_epochs: 10
  learning_rate: 3.0e-4   # decays linearly to 0 over total_steps
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [128, 128]    # the same for the policy and the value network
  activation: tanh
  # A residual run starts with its action head zeroed, so the start is exactly PD; the
  # bias must be 0. A smaller spread than base.yaml's keeps exploration from wrecking PD.
  log_std_init: -1.0
  initial_action_bias: 0.0

normalize:
  clip_obs: 10.0       # VecNormalize(norm_obs=True, norm_reward=True)

curriculum:
  start_at_hardest: true  # every stage unlocked at its hardest level from step 0
  window: 500          # success rate over the last this many episodes at the level
  # Bar to move up a level, per level (the last repeats): strict on the easy Stage A
  # levels, reachable on the hard ones (PD itself manages 58% at full difficulty).
  advance_at: [0.85, 0.85, 0.75, 0.65]
  unlock:
    beat_pd: false   # nothing left to unlock
  # Promote on a deterministic eval at each checkpoint (current level, the eval seeds), not
  # on training episodes: their exploration noise alone breaks the quiet-throttle success
  # rule, so the window never passes (EXPERIMENTS m7-full-001).
  promote_on: eval
  # How often each unlocked stage comes up (SPEC §9.9); sampled in Rust per episode.
  # B and C already match PD; D and E get the practice (owner's round-2 choice, 2026-10-19).
  stage_weights: {A: 0.25, B: 0.05, C: 0.1, D: 0.4, E: 0.2}

checkpoint:
  every_steps: 1_000_000
  eval_episodes: 200   # fixed-seed episodes per stage at its hardest level, to keep the best
  eval_seed: 1_000_000 # first eval seed, far from training seeds
