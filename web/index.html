<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nine Lives</title>
    <!-- Empty icon so the browser does not request a missing /favicon.ico. -->
    <link rel="icon" href="data:," />
    <style>
      /* One look for every HUD piece: these tokens set its colours, sizes and spacing. */
      :root {
        --edge: 16px;
        --radius: 10px;
        --panel: rgb(12 17 24 / 62%);
        --panel-solid: rgb(12 17 24 / 90%);
        --line: rgb(255 255 255 / 12%);
        --text: #f2f5f8;
        --muted: rgb(242 245 248 / 62%);
        --accent: #e0542f;
        --air: #8fd0ff;
        --danger: #ff5a4f;
        --link: #ffb59e;
        --heart: #e8343a;
        --heart-light: #ff8a8f;
        --heart-edge: #3a0a0c;
        --heart-lost: #2b2f36;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* Matches BACKDROP_HORIZON in src/render/backdrop.ts. */
        background: #2a3d52;
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #g-blackout {
        /* The g-force vignette (src/hud/g-blackout.ts): above the 3D view, under the HUD. */
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hud {
        position: fixed;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        backdrop-filter: blur(6px);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }

      /* Top-left: the nine hearts, what flies the car, and short notes. */
      #hud-top-left {
        position: fixed;
        left: var(--edge);
        top: var(--edge);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        pointer-events: none;
      }
      #hud-top-left > .hud {
        position: static;
      }
      #hud-hearts {
        display: flex;
        gap: 3px;
      }
      .heart svg {
        display: block;
        width: 27px;
        height: 24px;
      }
      .heart .o {
        fill: var(--heart-edge);
      }
      .heart .f {
        fill: var(--heart);
      }
      .heart .h {
        fill: var(--heart-light);
      }
      .heart.lost .f,
      .heart.lost .h {
        fill: var(--heart-lost);
      }
      #hud-status {
        font-size: 14px;
      }
      #hud-alert {
        font-size: 13px;
        color: #ffd9a8;
      }

      /* Top-right: the keys, always on screen. */
      #hud-keys {
        right: var(--edge);
        top: var(--edge);
        margin: 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 12px;
        font-size: 13px;
      }
      #hud-keys dt {
        color: var(--muted);
        white-space: nowrap;
      }
      #hud-keys dd {
        margin: 0;
      }

      /* Bottom-left: the dashboard, with the nozzle map beside speed and air. */
      #hud-dash {
        left: var(--edge);
        bottom: var(--edge);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 14px;
      }
      #hud-nozzles {
        /* nozzle-map.ts sizes it from the nozzle positions, in metres. */
        position: relative;
        flex: none;
      }
      #hud-nozzles .car-outline {
        /* nozzle-map.ts sets the inset so the outline matches the nozzle dots. */
        position: absolute;
        border: 2px solid rgb(255 255 255 / 40%);
        border-radius: 12px 12px 7px 7px;
      }
      .nozzle-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #d6ecff;
        box-shadow: 0 0 8px 2px var(--air);
      }
      .dash-readouts {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #hud-speed {
        font-size: 34px;
        font-weight: 650;
        line-height: 1;
      }
      #hud-speed small {
        margin-left: 4px;
        font-size: 14px;
        font-weight: 400;
        color: var(--muted);
      }
      #hud-air {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      #hud-air-track {
        width: 120px;
        height: 8px;
        border-radius: 4px;
        background: rgb(255 255 255 / 15%);
        overflow: hidden;
      }
      #hud-air-fill {
        width: 100%;
        height: 100%;
        background: var(--air);
      }
      #hud-air.low #hud-air-fill {
        background: var(--danger);
        animation: low-air-flash 0.6s steps(2, jump-none) infinite;
      }
      @keyframes low-air-flash {
        to {
          opacity: 0.25;
        }
      }

      /* Bottom-right: a link to the training viewer, with the wind above it when there is any. */
      #hud-watch {
        right: var(--edge);
        bottom: var(--edge);
        color: var(--text);
        font-size: 14px;
        text-decoration: none;
        pointer-events: auto;
      }
      #hud-watch:hover,
      #hud-watch:focus-visible {
        background: var(--panel-solid);
        color: var(--link);
      }
      #hud-wind {
        right: var(--edge);
        bottom: 60px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      #hud-wind-arrow,
      #hud-wind-arrow svg {
        display: block;
        width: 18px;
        height: 18px;
      }

      #hud-toast {
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        padding: 8px 18px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #hud-perf {
        /* F3 (src/hud/perf-overlay.ts): fps and ms per tick and per frame. */
        right: var(--edge);
        top: 200px;
        font-size: 13px;
      }

      /* Esc: the game stops until Esc again. */
      #paused {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 28px;
        background: var(--panel-solid);
        text-align: center;
      }
      #paused h2 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.06em;
      }
      #paused p {
        margin: 6px 0 0;
        font-size: 14px;
        color: var(--muted);
      }
      #paused a {
        display: inline-block;
        margin-top: 12px;
        color: var(--link);
        font-size: 14px;
        pointer-events: auto;
      }

      /* All nine lives gone: a black screen to restart from. */
      #game-over {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000;
        text-align: center;
      }
      #game-over .wordmark {
        margin: 0 0 18px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--accent);
      }
      #game-over h2 {
        margin: 0;
        font-size: 44px;
        letter-spacing: 0.06em;
      }
      #game-over p {
        margin: 0;
        color: var(--muted);
      }
      #restart {
        padding: 10px 34px;
        border: 0;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--text);
        font: inherit;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      #game-over a {
        color: var(--link);
        font-size: 14px;
      }

      /* Phones: the keys sit above the dashboard instead of beside the hearts. */
      @media (max-width: 640px) {
        #hud-keys {
          top: auto;
          right: auto;
          left: var(--edge);
          bottom: 132px;
          font-size: 12px;
        }
        #hud-wind {
          bottom: 132px;
        }
        /* The dashboard fills the bottom edge, so the viewer link moves to the free top-right. */
        #hud-watch {
          top: var(--edge);
          bottom: auto;
        }
        .heart svg {
          width: 20px;
          height: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hud-air.low #hud-air-fill {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="g-blackout" hidden></div>
    <div id="hud-top-left">
      <div id="hud-hearts" aria-label="Lives"></div>
      <div id="hud-status" class="hud">Realistic</div>
      <div id="hud-alert" class="hud" hidden></div>
    </div>
    <dl id="hud-keys" class="hud" aria-label="Keys">
      <dt>W S / ↑ ↓</dt>
      <dd>drive, brake</dd>
      <dt>A D / ← →</dt>
      <dd>steer</dd>
      <dt>Space</dt>
      <dd>hop</dd>
      <dt>Shift</dt>
      <dd>boost</dd>
      <dt>X</dt>
      <dd>drop test</dd>
      <dt>R</dt>
      <dd>respawn</dd>
      <dt>M</dt>
      <dd>mode</dd>
      <dt>V</dt>
      <dd>wind</dd>
      <dt>Esc</dt>
      <dd>pause</dd>
    </dl>
    <div id="hud-wind" class="hud" hidden>
      <span id="hud-wind-arrow">
        <svg viewBox="-12 -12 24 24" aria-hidden="true">
          <path d="M0 -10 L7 2 L2 1 L2 10 L-2 10 L-2 1 L-7 2 Z" fill="#d6ecff" />
        </svg>
      </span>
      <span id="hud-wind-label">Off</span>
    </div>
    <div id="hud-dash" class="hud">
      <div id="hud-nozzles"></div>
      <div class="dash-readouts">
        <div id="hud-speed"><span id="hud-speed-value">0</span><small>km/h</small></div>
        <div id="hud-air">
          Air
          <div id="hud-air-track"><div id="hud-air-fill"></div></div>
          <span id="hud-air-label">100%</span>
        </div>
      </div>
    </div>
    <!-- Out of the Tab order: Enter starts the Gauntlet, so a focused link would leave the game. -->
    <a id="hud-watch" class="hud" href="./viewer.html" tabindex="-1">Watch AI training</a>
    <div id="hud-toast" class="hud" hidden></div>
    <div id="hud-perf" class="hud" hidden></div>
    <section id="paused" class="hud" hidden>
      <h2>Paused</h2>
      <p>Press Esc to resume</p>
      <a href="./viewer.html">Watch AI training</a>
    </section>
    <section id="game-over" hidden>
      <h1 class="wordmark">Nine Lives</h1>
      <h2>Out of lives</h2>
      <p id="game-over-summary"></p>
      <button type="button" id="restart">Restart</button>
      <a href="https://github.com/Bhavya873/NineLives" target="_blank" rel="noopener"
        >Source and write-up on GitHub</a
      >
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
