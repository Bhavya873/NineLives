<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nine Lives — Training viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2a3d52;
        font-family: system-ui, sans-serif;
      }
      #viewer {
        position: fixed;
        inset: 0;
      }
      .panel {
        position: fixed;
        left: 16px;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(12, 18, 26, 0.75);
        color: #e8eef5;
        font-size: 14px;
      }
      #viewer-status {
        top: 16px;
      }
      #viewer-board {
        top: 56px;
        white-space: pre;
        font-variant-numeric: tabular-nums;
        line-height: 1.5;
      }
      #viewer-help {
        bottom: 16px;
        color: #a9b6c4;
      }
      #arena-toggle {
        top: 16px;
        left: auto;
        right: 16px;
        border: 1px solid #3a4a5c;
        cursor: pointer;
        font: inherit;
      }
      #arena-toggle:hover {
        background: rgba(30, 44, 60, 0.9);
      }
      a {
        color: #9fd1ff;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="viewer-status" class="panel">Loading checkpoints…</div>
    <div id="viewer-board" class="panel"></div>
    <button id="arena-toggle" class="panel" type="button">Switch arena</button>
    <div id="viewer-help" class="panel">
      Every checkpoint at once, one row each, on the same drops · O flat / obstacle arena · faded
      cars crashed · <a href="./">back to the game</a>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
