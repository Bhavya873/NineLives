<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nine Lives — Training viewer</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <div id="viewer"></div>
    <div id="viewer-panels"></div>
    <div id="hud-perf" class="tile" hidden></div>
    <div id="hud-perf-steps" class="tile" hidden></div>
    <div id="viewer-side">
      <h1 id="viewer-status" class="tile tile-display">Loading…</h1>
      <a id="viewer-back" class="tile" href="./?play=1&resume=1">back to game</a>
      <div id="stage-tabs" class="tile" role="group" aria-label="Stage tabs"></div>
      <button id="camera-toggle" class="tile tile-display" type="button">camera: crowd</button>
      <div id="curve-panel" class="tile">
        <h2 id="curve-title" class="tile-label"></h2>
        <div id="curve-chart"></div>
      </div>
      <table id="viewer-board" class="tile"></table>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
