# Continuous integration: three jobs, one per language (SPEC §12).
# Training never runs in CI. rust-toolchain.toml picks the Rust components and targets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Speed-sweep guard (one seed, no crashes)
        # A clean entry on any covered piece up to 200 km/h never crashes
        # (docs/contracts/survival.md). 768 runs, release build: a regression in the
        # physics, the pieces or the crash rules shows up here as crashed > 0.
        run: |
          cargo run --release --locked -q -p nl-control --example speed_sweep -- --seeds 1 --out target/sweep_ci
          python3 -c "import json; t = json.load(open('target/sweep_ci.json'))['totals']; print(t); assert t['runs'] == 768 and t['crashed'] == 0, t"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-dev.lock
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r python/requirements-dev.lock
          .venv/bin/pip install -e python
      - name: Build the Rust module
        # Release: the env tests run hundreds of physics steps, far too slow unoptimised.
        run: VIRTUAL_ENV=.venv .venv/bin/maturin develop --release -m crates/nl-py/Cargo.toml
      - name: Ruff
        run: |
          .venv/bin/ruff check python
          .venv/bin/ruff format --check python
      - name: Pytest
        run: .venv/bin/pytest python/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        working-directory: .
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build wasm
        run: npm run wasm
      - name: Wasm tests (golden trace and Game API)
        run: npm run test:wasm
      - name: Build
        run: npm run build
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        run: npm run test:e2e
      - name: "Release wasm size (SPEC 11.7, at most 2.5 MB gzipped)"
        run: |
          npm run wasm:release
          npm run build
          npm run size
